name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml, installs correct channel

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit only — no DATABASE_URL)
        run: cargo test --lib --bins
