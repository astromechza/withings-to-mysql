[graph]
targets = []

# ── Security advisories ───────────────────────────────────────────────────────
[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0071: RSA timing side-channel (Marvin Attack).
    # Pulled in transitively by sqlx-mysql for MySQL authentication.
    # No patched version of rsa exists; not directly used by this crate.
    # Risk is negligible: the RSA key operations happen during DB connection
    # handshake inside the private network, not over untrusted channels.
    { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-mysql, no fix available, low-risk in private network context" },
]

# ── License policy ────────────────────────────────────────────────────────────
[licenses]
version = 2
# All permissive licenses present in the transitive dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",            # Boost Software License (not Business Source) — ryu, whoami
    "CDLA-Permissive-2.0", # Mozilla CA bundle (webpki-roots)
]

# ── Duplicate / banned crates ─────────────────────────────────────────────────
[bans]
multiple-versions = "warn"   # flag but don't fail — sqlx pulls duplicates
wildcards = "allow"
deny = []

# ── Allowed source registries ─────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
